name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: openapi.json actualizado
        run: uv run python scripts/export_openapi.py --check

      # Integration/e2e levantan Postgres con testcontainers (Docker viene en ubuntu-latest).
      - name: Tests
        run: uv run pytest -m "not external and not smoke"
