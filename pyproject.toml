[project]
name = "cucharon-api"
version = "0.1.0"
description = "API de recetas y conteo de calorías"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "limits>=5.8.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PT", "DTZ"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # texto en español: acentos/ambiguous chars son legítimos
]

[tool.ruff.lint.isort]
# La carpeta alembic/ del repo confunde la detección: el paquete es de terceros.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/versions/**" = ["E501"]

[tool.pyright]
include = ["app", "tests", "alembic", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "external: le pega a servicios reales de terceros (contract tests); no corre en CI",
    "smoke: le pega a SMOKE_BASE_URL desplegado",
    "slow: tarda (p. ej. carreras repetidas); CI sí lo corre, local se puede saltar",
]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
